name: Update Google Reviews Count

on:
  schedule:
    - cron: '0 6 * * *' # täglich 06:00 UTC – Frequenz nach Bedarf anpassen
  workflow_dispatch: {} # manuelles Auslösen über den "Run workflow"-Button

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Bewertungsanzahl abrufen
        run: npm run scrape

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git diff --staged --quiet || git commit -m "chore: reviews.json aktualisiert [skip ci]"
          git push

      - name: jsDelivr-Cache leeren
        if: success()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/reviews.json" || true
